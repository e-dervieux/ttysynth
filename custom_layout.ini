; Custom keyboard layout
; ======================
;
; Used when LAYOUT = custom in config.ini ([KEYBOARD] section), or when
; cycling to it with the LAYOUT_NEXT control key (v by default).
;
; How to use
; ----------
; - Uncomment (remove the leading "; ") each note you want to play, and write
;   the key playing it after the "=", e.g.:
;       C4 = q
;       C#4 = z
; - Only uncommented lines are read. An uncommented line left without a key
;   is an error.
; - Notes are absolute (A4 = 440 Hz by default). They can be written with
;   sharps or flats: C#4 and Db4 are the same note, Cb4 is B3, B#3 is C4.
;   Notes outside the four octaves listed below can be added as well.
; - Notes must lie in the MIDI range, C-1 to G9.
; - The octave shift (OCTAVE_SHIFT in config.ini, changed while playing with
;   the OCTAVE_DOWN / OCTAVE_UP control keys) applies on top.
; - Mapping the same note to two keys is allowed, but logs a warning at
;   startup since it is probably unintentional.
;
; Allowed keys
; ------------
; - Any key producing a single character: letters (case does not matter),
;   digits, punctuation and symbols (, ; : ! ? . / * - + = ...), accented
;   letters of your keyboard layout (é è à ç ù ...). Write the character as
;   the key types it: a symbol needing Shift (e.g. + on some layouts) works,
;   but Shift must then be held to play it.
; - esc, tab, enter, space
;
; Not allowed (error at startup)
; ------------------------------
; - Modifier keys: ctrl, cmd, alt / option, shift, caps lock. Note that keys
;   pressed while ctrl, cmd or alt / option is held never play notes.
; - Other keys not producing a character: function keys, arrows,
;   backspace...
; - A key already used by another note, or by a control of config.ini
;   ([CONTROLS] section, by default: + - esc b n tab v ( )).

