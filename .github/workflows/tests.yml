# Automated tests on Linux and macOS, on every push and pull request. They
# need no audio device, keyboard or terminal (see tests/conftest.py).
name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false  # One failing platform does not cancel the others
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # A hung audio process test must not run for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
