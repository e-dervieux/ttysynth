; Synthesizer configuration. Every option is required: this file is the only
; source of settings, and unknown sections or options are reported as errors.
; Comments must be on their own line (a ';' after a value is part of it).

[AUDIO]
; Output device: empty for the system default, else its index or (part of)
; its name, as listed by: python main.py --list-devices
; The --device command line option overrides it.
DEVICE =
; Hz
SAMPLE_RATE = 48000
BUFFER_SIZE = 64
CHANNELS = 2
; Between 0 and 1
DEFAULT_VOLUME = 0.5
; Hz, frequency of A4
TUNING_FREQ = 440.0
; Temperament: equal (modern), pythagorean, meantone (quarter-comma) or
; werckmeister (Werckmeister I (III), "correct temperament"). The historical
; ones are built on C; A4 stays at TUNING_FREQ in all of them.
; TEMPERAMENT_NEXT cycles through them while playing.
TEMPERAMENT = equal
; Directory of the recordings (RECORD_START / RECORD_STOP), relative to this
; file, created if needed. The --record-dir command line option overrides it.
RECORD_DIR = recordings

[KEYBOARD]
; Initial note layout (LAYOUT_NEXT cycles through them while playing):
;   azerty, qwerty: built-in layouts covering C4 to E5, laid out like a piano
;                   keyboard (natural notes on the home row, sharps above)
;   custom:         notes mapped in the CUSTOM_LAYOUT file (path relative to
;                   this file), see custom_layout.ini for instructions. Left
;                   out of the cycle while the file maps no note.
LAYOUT = qwerty
CUSTOM_LAYOUT = custom_layout.ini
; Initial shift of the layout in whole octaves (e.g. -1 to start at C3),
; changed while playing with OCTAVE_DOWN / OCTAVE_UP
OCTAVE_SHIFT = 0

[CONTROLS]
VOLUME_UP = +
VOLUME_DOWN = -
QUIT = esc
RECORD_START = b
RECORD_STOP = n
INSTRUMENT_NEXT = tab
LAYOUT_NEXT = v
TEMPERAMENT_NEXT = c
OCTAVE_DOWN = (
OCTAVE_UP = )
